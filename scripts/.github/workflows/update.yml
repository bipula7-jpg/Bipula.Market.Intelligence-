name: Daily Market Data Update

on:
  # Runs Monday–Friday at 6:30 PM Eastern (23:30 UTC)
  # This is after NYSE/NASDAQ close (4 PM ET) giving time for data to settle
  schedule:
    - cron: "30 23 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market data update
        run: python scripts/update_market_data.py

      - name: Commit and push updated index.html
        run: |
          git config user.name  "SIGNAL Bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add index.html
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "📊 Market data update — $(date -u +'%Y-%m-%d')"
          git push
