name: Daily Keep-Alive

# The index.html now fetches live data directly from Yahoo Finance
# in the browser — no build step needed. This workflow simply touches
# the file once a day so GitHub Pages re-deploys and the date stays
# current. It will NEVER fail because it has no external API dependency.

on:
  schedule:
    - cron: '30 14 * * 1-5'   # 10:30 AM ET Mon-Fri (after market opens)
  workflow_dispatch:            # manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp date into HTML comment
        run: |
          DATE=$(TZ="America/New_York" date +'%Y-%m-%d %H:%M ET')
          # Insert/update a build timestamp comment in index.html
          sed -i "s|<!-- built:.*-->|<!-- built: $DATE -->|g" index.html
          # If no comment exists yet, append one before </body>
          grep -q "<!-- built:" index.html || \
            sed -i "s|</body>|<!-- built: $DATE -->\n</body>|" index.html

      - name: Commit if changed
        run: |
          git config user.name "SIGNAL Bot"
          git config user.email "signal@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Daily stamp $(TZ='America/New_York' date +'%Y-%m-%d')"
          git push
