name: Daily Market Data Update

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 9:30 AM ET (13:30 UTC) — market open
    - cron: "30 21 * * 1-5"   # 4:05 PM ET (21:30 UTC) — after close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market data update
        run: python scripts/update_market_data.py

      - name: Commit and push updated index.html
        run: |
          git config user.name  "SIGNAL Bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "📊 Market data update — $(date -u +'%Y-%m-%d')"
          git push
